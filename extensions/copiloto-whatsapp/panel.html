<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copiloto Casa Bonita</title>
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
<header>
  <div><span class="brand">CASA BONITA</span><h1>Copiloto</h1></div>
  <button id="theme" type="button" aria-pressed="false">Fundo preto</button>
</header>
<main>
  <form id="login">
    <p>Entre com sua conta da Universidade.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Entrar</button>
  </form>

  <section id="workspace" hidden>
    <div class="row">
      <a href="https://universidade-grupo-okada.vercel.app/crm-piloto.html" target="_blank" rel="noopener noreferrer">Abrir CRM</a>
      <button id="sign-out" type="button">Sair</button>
    </div>
    <label for="contact">Contato no CRM</label>
    <input id="search" type="search" aria-label="Buscar contato pelo nome" placeholder="Buscar pelo nome">
    <select id="contact"><option value="">Selecione um contato</option></select>
    <label for="purpose">Objetivo</label>
    <select id="purpose">
      <option value="resposta">Responder à conversa</option>
      <option value="objecao">Trabalhar uma objeção</option>
      <option value="followup">Follow-up de proposta</option>
      <option value="retomada">Retomar cliente sem resposta</option>
      <option value="prospeccao">Prospectar cliente</option>
      <option value="arquiteto">Falar com arquiteto</option>
    </select>
    <label for="question">Pergunta para o Copiloto (opcional)</label>
    <textarea id="question" maxlength="500" rows="3" placeholder="Ex.: Como tratar esta objeção?"></textarea>
    <button id="generate" class="primary" type="button" disabled>Gerar orientação</button>
    <p class="note">Confirme se este é o contato aberto no WhatsApp. A orientação usa as mensagens sincronizadas no CRM.</p>

    <section id="result" hidden>
      <h2>Rascunho para revisar</h2>
      <textarea id="draft" aria-label="Rascunho sugerido" rows="5"></textarea>
      <button id="copy" type="button">Copiar resposta</button>
      <details><summary>Ver análise</summary><p id="analysis"></p></details>
    </section>
  </section>
  <p id="status" role="status"></p>
</main>
</body>
</html>
