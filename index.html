<section id="conteudo" class="section"><div class="sectionTitle"><h2>Conteúdo e missões</h2><span class="pill">Universidade em crescimento</span></div><div class="grid4"><div class="metricCard"><div class="metricLabel">Aulas publicadas</div><div class="metricValue">${cache.ls.length}</div></div><div class="metricCard"><div class="metricLabel">Missões práticas</div><div class="metricValue">${cache.missions.length}</div></div><div class="metricCard"><div class="metricLabel">Competências</div><div class="metricValue">${cache.comps.length}</div></div><div class="metricCard"><div class="metricLabel">Certificações</div><div class="metricValue">${cache.certs.length}</div></div></div><div class="card" style="margin-top:12px"><h3>Banco de missões</h3><div class="grid2">${cache.missions.map(m=>`<div class="feature"><b>${esc(m.title)}</b><p class="mut">${esc(m.description)}</p><span class="pill">${esc(m.competency_code||'')}</span> <span class="pill">+${m.points} pts</span></div>`).join('')}</div></div></section>
<section id="metas" class="section"><div class="sectionTitle"><div><div class="kicker">2026</div><h2>Metas e performance</h2></div><span class="pill">Sazonalidade preparada</span></div>${renderGoals()}</section><section id="minhauni" class="section"><div class="card"><div class="kicker">Desenvolvimento da liderança</div><h2>Minha Universidade</h2><p class="mut">Administradores também podem estudar as 56 aulas, fazer Marco Zero, Cliente IA, missões e acompanhar a própria evolução.</p><button class="btn" onclick="loadConsult()">Entrar como aluno sem perder acesso administrativo</button></div></section>`}
function renderManagerQueue(limit=10){let q=(cache.managerQueue||[]).slice(0,limit);return q.length?`<div class="priorityList">${q.map(x=>`<div class="priorityItem ${x.management_priority==='CRÍTICA'?'critical':x.management_priority==='ALTA'?'high':''}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.full_name)}</b><div class="mut">${esc(x.store||'')} · Índice ${num(x.evolution_index).toFixed(1)}</div></div><span class="badge ${x.management_priority==='CRÍTICA'?'amber':''}">${esc(x.management_priority)}</span></div><p>${esc(x.next_manager_action||'')}</p><div class="statusline"><span class="pill">Prioridade: ${esc(x.channel_priority||'—')}</span><span class="pill">Presencial ${num(x.presencial_score)?num(x.presencial_score).toFixed(1):'—'}</span><span class="pill">Virtual ${num(x.virtual_score)?num(x.virtual_score).toFixed(1):'—'}</span></div></div>`).join('')}</div>`:'<div class="empty">A fila aparecerá quando os consultores iniciarem a jornada.</div>'}
function renderAlerts(limit=10){let a=(cache.alerts||[]).slice(0,limit);return a.length?a.map(x=>{let p=cache.ps.find(z=>z.id===x.user_id);return `<div class="feature ${x.severity==='critical'?'alertCritical':x.severity==='positive'?'alertPositive':''}" style="margin-top:8px"><b>${esc(x.title)}</b><span class="badge" style="float:right">${esc(x.severity)}</span><p class="mut">${esc(p?.full_name||'Consultor')}</p><p>${esc(x.message)}</p><small>${esc(x.recommended_action||'')}</small></div>`}).join(''):'<div class="empty">Nenhum alerta aberto.</div>'}
function renderChannelOverview(){let c=cache.command||[];if(!c.length)return '<div class="empty">As notas presencial e virtual aparecerão após avaliações práticas.</div>';return `<div class="tableWrap"><table><thead><tr><th>Consultor</th><th>Presencial</th><th>Virtual</th><th>Prioridade</th></tr></thead><tbody>${c.map(x=>`<tr><td><b>${esc(x.full_name)}</b></td><td>${num(x.presencial_score)?num(x.presencial_score).toFixed(1):'—'}</td><td>${num(x.virtual_score)?num(x.virtual_score).toFixed(1):'—'}</td><td><span class="pill">${esc(x.channel_priority)}</span></td></tr>`).join('')}</tbody></table></div>`}
function renderPresentationInbox(limit=10,full=false){let r=(cache.presentationInbox||[]).slice(0,limit);return r.length?r.map(x=>`<div class="feature presentBox" style="margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.full_name)} · ${esc(x.title)}</b><div class="mut">${esc(x.store||'')} · ${new Date(x.requested_at).toLocaleDateString('pt-BR')}</div></div><span class="badge amber">${esc(x.status)}</span></div>${x.what_i_learned?`<p><b>Aprendeu:</b> ${esc(x.what_i_learned)}</p>`:''}${x.doubts?`<p><b>Dúvidas:</b> ${esc(x.doubts)}</p>`:''}${x.suggestions?`<p><b>Sugestões:</b> ${esc(x.suggestions)}</p>`:''}${x.what_i_want_to_show?`<p><b>Quer mostrar:</b> ${esc(x.what_i_want_to_show)}</p>`:''}${full?`<textarea id="prfb-${x.id}" rows="2" placeholder="Feedback da liderança"></textarea><div class="row"><button class="btn tiny" onclick="presentationAction('${x.id}','presented')">Marcar como apresentado</button><button class="btn ghost tiny" onclick="presentationAction('${x.id}','reinforcement')">Pedir reforço</button></div>`:''}</div>`).join(''):'<div class="empty">Nenhum consultor solicitou apresentação ainda.</div>'}
function renderStores(){let s=cache.stores||[];return s.length?`<div class="tableWrap"><table><thead><tr><th>Loja</th><th>Consultores</th><th>Índice</th><th>IA</th><th>Competências</th></tr></thead><tbody>${s.map(x=>`<tr><td><b>${esc(x.store)}</b></td><td>${num(x.consultants)}</td><td>${num(x.evolution_average).toFixed(1)}</td><td>${num(x.ai_average)?num(x.ai_average).toFixed(1):'—'}</td><td>${num(x.competency_average)?num(x.competency_average).toFixed(1):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Comparativo será preenchido com os perfis das lojas.</div>'}
function renderEvolutionHistory(){let s=cache.snapshots||[];if(!s.length)return '<div class="empty">O histórico começa a ser construído a partir dos snapshots de evolução.</div>';let by={};s.forEach(x=>(by[x.user_id]??=[]).push(x));return Object.entries(by).map(([id,a])=>{let p=cache.ps.find(x=>x.id===id);let vals=a.slice(-12),max=Math.max(1,...vals.map(x=>num(x.evolution_index)));return `<div class="feature" style="margin-top:8px"><b>${esc(p?.full_name||'Consultor')}</b><div class="spark" style="margin-top:10px">${vals.map(x=>`<b style="height:${Math.max(5,num(x.evolution_index)/max*100)}%" title="${x.snapshot_date}: ${num(x.evolution_index).toFixed(1)}"></b>`).join('')}</div><small class="mut">${vals.length} medição(ões) registradas</small></div>`}).join('')}
window.presentationAction=async(id,status)=>{let feedback=$('prfb-'+id)?.value.trim()||'';let payload={status,manager_id:user.id,manager_feedback:feedback,updated_at:new Date().toISOString()};if(status==='presented')payload.presented_at=new Date().toISOString();let{error}=await sb.from('presentation_requests').update(payload).eq('id',id);if(error)return toast(error.message);toast('Apresentação atualizada.');loadAdmin()}
function renderRanking(){let rows=(cache.evo||[]).filter(x=>x.role!=='admin').slice().sort((a,b)=>num(b.evolution_index)-num(a.evolution_index));return rows.length?rows.slice(0,8).map((x,i)=>`<div class="rank"><div style="display:flex;align-items:center;gap:10px"><span class="rankNo">${i+1}</span><div><b>${esc(x.full_name)}</b><div class="mut" style="font-size:12px">${esc(x.graduation)} · ${esc(x.recommended_action)}</div></div></div><div style="text-align:right"><b>${num(x.evolution_index).toFixed(1)}</b><div class="mut" style="font-size:11px">${num(x.xp)} XP</div></div></div>`).join(''):'<div class="empty">O ranking aparecerá quando os consultores fizerem o primeiro acesso.</div>'}
function renderFunnel(){let labels=['ENSINAR','TREINAR','MEDIR','APLICAR','ACOMPANHAR','EVOLUIR'];let total=Math.max(1,(cache.evo||[]).filter(x=>x.role!=='admin').length);return `<div class="miniBars">${labels.map(l=>{let n=(cache.evo||[]).filter(x=>x.role!=='admin'&&x.recommended_action===l).length;return `<div class="miniBar"><span>${l}</span><div class="track"><div class="fill" style="width:${n/total*100}%"></div></div><b>${n}</b></div>`}).join('')}</div>`}
function renderActivity(){let data=cache.activity||[];if(!data.length){let simulated=[18,35,24,48,60,52,72,65,80,76,90,100];return `<div class="heat">${simulated.map((v,i)=>`<i class="${v>50?'on':''}" style="opacity:${.25+v/140}" title="período ${i+1}"></i>`).join('')}</div><p class="mut">O histórico real começa a ser preenchido conforme aulas, missões, IA e avaliações forem usadas.</p>`}return `<div class="feed">${data.slice(0,7).map(a=>`<div class="feedItem"><b>${esc(a.title)}</b><div class="mut">${esc(a.detail||'')} · ${new Date(a.created_at).toLocaleDateString('pt-BR')}</div></div>`).join('')}</div>`}
function renderGradeDistribution(){let levels=['Em Formação','Bronze','Prata','Ouro','Diamante'];let all=(cache.evo||[]).filter(x=>x.role!=='admin');return `<div class="gradeTrack">${levels.map(l=>{let n=all.filter(x=>x.graduation===l).length;return `<div class="gradeStep ${n?'active':''}"><b>${l}</b><div class="metricValue" style="font-size:24px">${n}</div></div>`}).join('')}</div><p class="mut">A graduação combina conhecimento, competência, prática real e aprovação da liderança.</p>`}
function renderTeamCompetencies(){return cache.comps.map(c=>{let vals=cache.scores.filter(x=>x.competency===c.code||x.competency===c.name).map(x=>num(x.score));let avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;return `<div class="comp" style="margin-top:8px"><div class="compHead"><b>${esc(c.name)}</b><span>${avg?avg.toFixed(1):'—'}</span></div><div class="progress"><i style="width:${avg*10}%"></i></div></div>`}).join('')}
function renderGoals(){if(!cache.goals.length)return '<div class="card"><div class="empty">Estrutura pronta. Os dados de metas entram quando os usuários forem ativados e os valores cadastrados.</div></div>';let totalGoal=cache.goals.reduce((a,g)=>a+num(g.annual_goal),0),totalActual=cache.goals.reduce((a,g)=>a+num(g.actual_ytd),0);return `<div class="metricGrid"><div class="metricCard"><div class="metricLabel">Meta anual cadastrada</div><div class="metricValue">${money(totalGoal)}</div></div><div class="metricCard"><div class="metricLabel">Realizado YTD</div><div class="metricValue">${money(totalActual)}</div></div><div class="metricCard"><div class="metricLabel">Atingimento</div><div class="metricValue">${pct(totalActual,totalGoal)}%</div></div><div class="metricCard"><div class="metricLabel">Gap</div><div class="metricValue">${money(Math.max(0,totalGoal-totalActual))}</div></div></div><div class="card" style="margin-top:12px"><div class="tableWrap"><table><thead><tr><th>Consultor</th><th>Meta anual</th><th>Realizado</th><th>Atingimento</th><th>Visual</th></tr></thead><tbody>${cache.goals.map(g=>{let p=cache.ps.find(x=>x.id===g.user_id),v=pct(g.actual_ytd,g.annual_goal);return `<tr><td>${esc(p?.full_name||g.store||'Equipe')}</td><td>${money(g.annual_goal)}</td><td>${money(g.actual_ytd)}</td><td><b>${v}%</b></td><td style="min-width:160px"><div class="progress"><i style="width:${Math.min(100,v)}%"></i></div></td></tr>`}).join('')}</tbody></table></div></div>`}
function teamTable(cs){return `<div class="tableWrap"><table><thead><tr><th>Consultor</th><th>Loja</th><th>Graduação</th><th>Índice</th><th>Aulas</th><th>IA</th><th>Competências</th><th>Próxima ação</th></tr></thead><tbody>${cs.map(x=>{let e=evoRow(x.id);return `<tr class="click" onclick="member('${x.id}')"><td><b>${esc(x.full_name)}</b></td><td>${esc(x.store||'—')}</td><td>${esc(x.graduation)}</td><td><b>${num(e.evolution_index).toFixed(1)}</b></td><td>${num(e.completed_lessons)}/${num(e.total_lessons)||56}</td><td>${num(e.ai_avg)?num(e.ai_avg).toFixed(1):'—'}</td><td>${num(e.competency_avg)?num(e.competency_avg).toFixed(1):'—'}</td><td><span class="badge ${actionColor(e.recommended_action)}">${esc(e.recommended_action)}</span></td></tr>`}).join('')}</tbody></table></div>`}
function renderAttention(cs){let arr=cs.map(x=>({x,e:evoRow(x.id)})).sort((a,b)=>num(a.e.evolution_index)-num(b.e.evolution_index)).slice(0,5);return arr.length?arr.map(z=>`<div class="feature adminAlert" style="margin-top:8px"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(z.x.full_name)}</b><p class="mut" style="margin-bottom:0">${esc(z.e.recommended_action)} · índice ${num(z.e.evolution_index).toFixed(1)}</p></div><span class="actionChip">${num(z.e.lesson_percent).toFixed(0)}% aulas</span></div><button class="btn ghost tiny" style="margin-top:10px" onclick="showSec('equipe');member('${z.x.id}')">Abrir evolução</button></div>`).join(''):'<div class="empty">Os alertas aparecerão após o primeiro acesso dos consultores.</div>'}
function renderReviews(){let pend=cache.su.filter(x=>x.status==='pending');return pend.length?pend.map(s=>{let p=cache.ps.find(x=>x.id===s.user_id),l=cache.ls.find(x=>x.id===s.lesson_id);return `<div class="card"><b>${esc(p?.full_name||'Consultor')}</b><p class="mut">${esc(l?.code||'')} · ${esc(l?.title||'Missão')}</p><p>${esc(s.text_content||'')}</p><textarea id="fb-${s.id}" rows="2" placeholder="Feedback do gestor"></textarea><button class="btn tiny" onclick="review('${s.id}','approved')">Aprovar</button> <button class="btn ghost tiny" onclick="review('${s.id}','needs_revision')">Pedir reforço</button></div>`}).join(''):'<div class="empty">Nenhuma evidência aguardando revisão.</div>'}
function renderWeeklyReviews(){let p=cache.weekly.filter(x=>x.status==='submitted');return p.length?p.map(x=>{let u=cache.ps.find(z=>z.id===x.user_id);return `<div class="feature" style="margin-top:8px"><b>${esc(u?.full_name||'Consultor')} · Semana ${x.week_number}</b><p>${esc(x.main_learning)}</p><p class="mut">Aplicação: ${esc(x.real_application||'—')} · Resultado: ${esc(x.result_obtained||'—')}</p>${x.in_person_application?`<p><b>Presencial:</b> ${esc(x.in_person_application)}</p>`:''}${x.virtual_application?`<p><b>Virtual:</b> ${esc(x.virtual_application)}</p>`:''}${x.doubts?`<p><b>Dúvidas:</b> ${esc(x.doubts)}</p>`:''}${x.suggestions?`<p><b>Sugestões:</b> ${esc(x.suggestions)}</p>`:''}<textarea id="wfb-${x.id}" rows="2" placeholder="Feedback"></textarea><div class="row"><input id="wcs-${x.id}" type="number" min="0" max="10" class="input" placeholder="Compreensão 0–10"><input id="was-${x.id}" type="number" min="0" max="10" class="input" placeholder="Aplicação 0–10"><input id="wcl-${x.id}" type="number" min="0" max="10" class="input" placeholder="Clareza 0–10"></div><button class="btn tiny" onclick="weeklyReview('${x.id}','approved')">Apto</button> <button class="btn ghost tiny" onclick="weeklyReview('${x.id}','reinforcement')">Reforço</button></div>`}).join(''):'<div class="empty">Nenhum encontro semanal aguardando avaliação.</div>'}
window.review=async(id,status)=>{let fb=$('fb-'+id)?.value.trim()||'';let{error}=await sb.from('submissions').update({status,reviewer_id:user.id,reviewer_feedback:fb,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);toast('Avaliação salva.');loadAdmin()};window.weeklyReview=async(id,status)=>{let payload={status,manager_feedback:$('wfb-'+id).value.trim(),comprehension_score:num($('wcs-'+id).value)||null,application_score:num($('was-'+id).value)||null,clarity_score:num($('wcl-'+id).value)||null,updated_at:new Date().toISOString()};let{error}=await sb.from('weekly_evolution').update(payload).eq('id',id);if(error)return toast(error.message);toast('Encontro semanal avaliado.');loadAdmin()}
window.member=async id=>{showSec('equipe');let x=cache.ps.find(z=>z.id===id),e=evoRow(id),d=num(e.completed_lessons),pe=cache.su.filter(z=>z.user_id===id&&z.status==='pending').length,ok=cache.su.filter(z=>z.user_id===id&&z.status==='approved').length,ais=cache.ais.filter(z=>z.user_id===id),sc=cache.scores.filter(z=>z.user_id===id),wk=cache.weekly.filter(z=>z.user_id===id),pl=cache.plans.filter(z=>z.user_id===id),as=cache.assess.filter(z=>z.user_id===id),um=cache.um.filter(z=>z.user_id===id),ucs=cache.userCerts.filter(z=>z.user_id===id);let map={};sc.forEach(y=>map[y.competency]=Math.max(num(map[y.competency]),num(y.score)));let levels=['Em Formação','Bronze','Prata','Ouro','Diamante'],cur=Math.max(0,levels.indexOf(x.graduation));$('memberDetail').innerHTML=`<div class="card" style="margin-top:12px"><div class="sectionTitle"><div><div class="kicker">Acompanhamento individual</div><h2>${esc(x.full_name)}</h2><p class="mut">${esc(x.store||'')} · ${esc(x.graduation)}</p></div><span class="badge green">Central de Evolução</span></div><div class="evolutionHero"><div><div class="grid4"><div class="feature"><b>Índice de evolução</b><div class="evolutionScore">${num(e.evolution_index).toFixed(1)}</div></div><div class="feature"><b>Aulas</b><div class="metricValue">${d}/${num(e.total_lessons)||56}</div><div class="progress"><i style="width:${num(e.lesson_percent)}%"></i></div></div><div class="feature"><b>Cliente IA</b><div class="metricValue">${num(e.ai_avg)?num(e.ai_avg).toFixed(1):'—'}</div><p class="mut">${num(e.ai_count)} simulações</p></div><div class="feature"><b>XP</b><div class="metricValue">${num(e.xp)}</div><p class="mut">${num(e.certifications)} certificações</p></div></div><div class="gradeTrack">${levels.map((l,i)=>`<div class="gradeStep ${i<cur?'done':i===cur?'active':''}"><b>${l}</b></div>`).join('')}</div></div><div class="card" style="padding:14px"><div class="ring" style="--v:${Math.round(num(e.evolution_index))};margin:auto"><span>${Math.round(num(e.evolution_index))}</span></div><div style="text-align:center;margin-top:10px"><div class="kicker">Próxima ação</div><h3 style="margin:5px 0">${esc(e.recommended_action)}</h3><p class="mut">${e.recommended_action==='ENSINAR'?'Iniciar fundamentos e acompanhar as primeiras aulas.':e.recommended_action==='TREINAR'?'Realizar simulação e praticar atendimento.':e.recommended_action==='MEDIR'?'Avaliar competências observadas em campo.':e.recommended_action==='APLICAR'?'Transformar conhecimento em missão com evidência.':e.recommended_action==='ACOMPANHAR'?'Cobrar consistência e reflexão semanal.':'Aumentar o nível de desafio e preparar próxima graduação.'}</p></div></div></div><div class="grid2" style="margin-top:12px"><div><h3>Radar de competências</h3><div class="radar">${cache.comps.map(c=>{let s=map[c.code]||map[c.name]||0;return `<div class="comp"><div class="compHead"><b>${esc(c.name)}</b><span>${s?s.toFixed(1):'—'}</span></div><div class="progress"><i style="width:${s*10}%"></i></div></div>`}).join('')}</div></div><div><h3>Diagnóstico de evolução</h3><div class="feature"><b>Marco Zero</b><p class="mut">${as.length?`Nota ${num(as[0].total_score).toFixed(1)}/10`:'Não realizado'}</p></div><div class="feature" style="margin-top:8px"><b>Plano 90 dias</b><p class="mut">${pl.length?pl.map(z=>esc(z.priority)).join(' · '):'Não iniciado'}</p></div><div class="feature" style="margin-top:8px"><b>Missões em campo</b><p class="mut">${num(e.missions_approved)} aprovadas · ${um.filter(z=>z.status==='submitted').length} aguardando avaliação</p></div><div class="feature" style="margin-top:8px"><b>Encontro semanal</b><p class="mut">${num(e.weekly_approved)} aprovado(s) · ${wk.filter(z=>z.status==='reinforcement').length} em reforço</p></div><div class="feature" style="margin-top:8px"><b>Certificações</b><p class="mut">${ucs.length?ucs.map(u=>{let c=cache.certs.find(z=>z.id===u.certification_id);return c?esc(c.name):''}).filter(Boolean).join(' · '):'Nenhuma conquistada ainda'}</p></div></div></div></div>`;$('memberDetail').scrollIntoView({behavior:'smooth'})}
sb.auth.onAuthStateChange((ev,s)=>{if(s&&$('app').classList.contains('hide'))setTimeout(boot,0)});boot();
</script></body></html>
