name: Validacao de provas gerenciais (homologacao)
on:
  push:
    branches:
      - safety/manager-regrade-exams-20261029
  pull_request:
    paths:
      - index.html
      - tests/manager-verified-exams.test.mjs
      - tests/manager-exam-server-gate.test.mjs
      - security/manager_exam_gate.sql
      - tests/trilha-real-exam-pilot.test.mjs
      - tests/trilha-90-dias-gate-painel-real.test.mjs
permissions:
  contents: read
jobs:
  provas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provas A/B, conferencia gerencial e regressao do historico
        run: node --test tests/manager-verified-exams.test.mjs tests/manager-exam-server-gate.test.mjs tests/trilha-real-exam-pilot.test.mjs tests/trilha-90-dias-gate-painel-real.test.mjs
