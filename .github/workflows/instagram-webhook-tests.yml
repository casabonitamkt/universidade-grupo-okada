name: Instagram webhook tests
on:
  pull_request:
    paths:
      - 'api/instagram-inbound.js'
      - 'tests/instagram-inbound.test.cjs'
      - '.github/workflows/instagram-webhook-tests.yml'
permissions:
  contents: read
jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/instagram-inbound.test.cjs
