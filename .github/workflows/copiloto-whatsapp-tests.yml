name: Copiloto WhatsApp Web tests
on:
  pull_request:
    paths:
      - 'extensions/copiloto-whatsapp/**'
      - 'tests/copiloto-whatsapp-selection.test.cjs'
      - '.github/workflows/copiloto-whatsapp-tests.yml'
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/copiloto-whatsapp-selection.test.cjs
