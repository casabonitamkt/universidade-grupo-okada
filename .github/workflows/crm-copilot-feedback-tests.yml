name: CRM copilot feedback permissions
on:
  pull_request:
    paths:
      - 'migrations/2026-11-27-crm-feedback-copiloto.sql'
      - 'tests/crm-copilot-feedback.sql'
      - '.github/workflows/crm-copilot-feedback-tests.yml'
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql "postgresql://postgres:fixture@127.0.0.1:5432/postgres" -f tests/crm-copilot-feedback.sql
