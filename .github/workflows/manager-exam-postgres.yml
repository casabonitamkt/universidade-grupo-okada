name: Manager exam gate — isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'migrations/2026-10-29-manager-exam-gate-HOMOLOGACAO.sql'
      - 'tests/sql/**'
      - '.github/workflows/manager-exam-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d training_gate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Testar RLS, gestor, reteste e regressao historica em banco descartavel
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d training_gate_test -v ON_ERROR_STOP=1 \
            -f tests/sql/manager-gate-fixture.sql \
            -f migrations/2026-10-29-manager-exam-gate-HOMOLOGACAO.sql \
            -f tests/sql/manager-gate-smoke.sql
